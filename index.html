<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>すくば市消防本部 指令台</title>
    <style>
        :root {
            --win-bg: #d4d0c8;
            --screen-black: #000000;
            --active-red: #ff0000;
            --btn-white: #ffffff;
        }

        body {
            background-color: var(--win-bg);
            font-family: 'MS UI Gothic', sans-serif;
            margin: 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            height: 98vh;
        }

        /* 司令設定エリア */
        .settings-panel {
            background: #eee;
            border: 2px inset #fff;
            padding: 10px;
            margin-bottom: 10px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 10px;
        }

        .setting-item { display: flex; flex-direction: column; gap: 5px; }
        .label-text { font-size: 12px; font-weight: bold; }
        select, input { padding: 8px; font-size: 14px; border: 2px inset #fff; background: white; }

        /* 車両グリッド */
        .grid-container {
            flex-grow: 1;
            background-color: var(--screen-black);
            display: grid;
            grid-template-columns: 140px repeat(4, 1fr);
            grid-auto-rows: 55px;
            gap: 2px;
            border: 3px inset #808080;
            padding: 2px;
            overflow-y: auto;
        }

        .cell {
            background-color: #2a2a2a; color: white; border: 1px solid #444;
            display: flex; align-items: center; justify-content: center; cursor: pointer;
            font-size: 14px; text-align: center;
        }

        .cell-station { background-color: #444; font-weight: bold; cursor: default; }

        .cell.active {
            background-color: var(--active-red);
            animation: flash 0.5s infinite alternate;
        }

        @keyframes flash { from { opacity: 1; } to { opacity: 0.5; } }

        /* 下部ボタン */
        .footer-nav { margin-top: 10px; display: flex; justify-content: flex-end; }

        .btn-dispatch {
            background-color: var(--btn-white);
            color: black;
            border: 3px outset #ccc;
            padding: 15px 50px;
            font-size: 22px;
            font-weight: bold;
            cursor: pointer;
        }
        .btn-dispatch:active { border-style: inset; }
    </style>
</head>
<body>

<div class="settings-panel">
    <div class="setting-item">
        <span class="label-text">司令区分</span>
        <select id="cmdType">
            <option value="火災司令">火災司令</option>
            <option value="救急司令">救急司令</option>
            <option value="救助司令">救助司令</option>
            <option value="災害司令">災害司令</option>
            <option value="その他">その他</option>
        </select>
    </div>
    <div class="setting-item">
        <span class="label-text">町名・場所</span>
        <select id="townName">
            <option value="学園都市">学園都市</option>
            <option value="蔓崎">蔓崎</option>
            <option value="研究学園都市">研究学園都市</option>
            <option value="新都市中央通り">新都市中央通り</option>
            <option value="すくば駅">すくば駅</option>
        </select>
    </div>
    <div class="setting-item">
        <span class="label-text">丁目</span>
        <select id="blockNum">
            <option value="">（なし）</option>
            <option value="一丁目">一丁目</option>
            <option value="二丁目">二丁目</option>
            <option value="三丁目">三丁目</option>
            <option value="四丁目">四丁目</option>
            <option value="五丁目">五丁目</option>
        </select>
    </div>
    <div class="setting-item">
        <span class="label-text">付加情報</span>
        <select id="nearBy">
            <option value="">（なし）</option>
            <option value="付近">付近</option>
        </select>
    </div>
    <div class="setting-item" style="grid-column: span 2;">
        <span class="label-text">自由入力詳細</span>
        <input type="text" id="freeText" placeholder="内容を入力">
    </div>
</div>

<div class="grid-container" id="grid"></div>

<div class="footer-nav">
    <button class="btn-dispatch" onclick="startDispatch()">出動決定</button>
</div>

<script>
    const data = [
        {
            station: "中央署",
            units: ["高度救助隊11", "高度救助隊12", "第一救急隊 14", "第二救急隊 8", "中央タンク34", "中央ポンプ4", "中央指揮2"]
        },
        {
            station: "並木分署",
            units: ["並木指揮6", "並木ポンプ64", "並木高度救助隊 13", "並木タンク9", "並木第一救急隊 16", "並木第二救急隊 14"]
        }
    ];

    const grid = document.getElementById('grid');
    data.forEach(group => {
        const sCell = document.createElement('div');
        sCell.className = 'cell cell-station';
        sCell.innerText = group.station;
        grid.appendChild(sCell);
        group.units.forEach(u => {
            const cell = document.createElement('div');
            cell.className = 'cell';
            cell.innerText = u;
            cell.onclick = () => {
                window.speechSynthesis.cancel(); // 詰まり防止
                cell.classList.toggle('active');
            };
            grid.appendChild(cell);
        });
        let fill = 5 - ((group.units.length + 1) % 5);
        if (fill < 5 && fill > 0) for(let i=0; i<fill; i++) grid.appendChild(document.createElement('div')).className='cell';
    });

    function startDispatch() {
        const selectedElements = document.querySelectorAll('.cell.active');
        const selectedUnits = Array.from(selectedElements).map(el => el.innerText);
        
        if (selectedUnits.length === 0) return;

        const cmd = document.getElementById('cmdType').value;
        const town = document.getElementById('townName').value;
        const block = document.getElementById('blockNum').value;
        const near = document.getElementById('nearBy').value;
        const free = document.getElementById('freeText').value;

        // 音声組み立て：「すくば市」に固定
        const address = `すくば市、${town}、${block}${near}`;
        const speechText = `${cmd}。${address}。${free}。出動部隊、${selectedUnits.join("、")}。以上。`;

        // 上書き再生
        window.speechSynthesis.cancel();

        const uttr = new SpeechSynthesisUtterance(speechText);
        uttr.lang = 'ja-JP';
        uttr.rate = 1.2;

        setTimeout(() => {
            window.speechSynthesis.speak(uttr);
        }, 100);

        // 出動済み処理
        selectedElements.forEach(el => {
            el.classList.remove('active');
            el.style.backgroundColor = "#500";
        });
    }
</script>
</body>
</html>
