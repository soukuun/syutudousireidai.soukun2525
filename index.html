<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>すくば市消防本部 指令台システム</title>
    <style>
        :root {
            --bg-white: #ffffff;
            --panel-gray: #f5f5f5;
            --border-line: #bbbbbb;
            --text-black: #000000;
            --active-red: #ff3333;
            --dispatched-gray: #d0d0d0;
        }

        * {
            box-sizing: border-box;
        }

        body {
            background-color: var(--panel-gray);
            font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "Segoe UI", "Hiragino Kaku Gothic ProN", "Meiryo", sans-serif;
            margin: 0;
            padding: 8px;
            display: flex;
            flex-direction: column;
            height: 100vh;
            color: var(--text-black);
            user-select: none;
            overflow: hidden;
        }

        /* 【重要】車両編成エリア：崩れ防止対策 */
        .grid-container {
            height: 42%;
            background-color: var(--bg-white);
            display: grid;
            grid-template-columns: 120px repeat(4, 1fr); /* 1列目は少し狭く、残り4列を均等に */
            grid-auto-rows: 1fr; /* 画面全体の高さに合わせて各マスが均等に伸び縮みする */
            gap: 2px;
            border: 2px solid var(--border-line);
            padding: 3px;
            overflow-y: auto;
            margin-bottom: 8px;
        }

        /* 1つのマス（セル）の崩れを完全にリセット */
        .cell {
            background-color: var(--bg-white);
            color: var(--text-black);
            border: 1px solid #e0e0e0;
            display: flex;
            align-items: center;        /* 上下中央揃え */
            justify-content: center;     /* 左右中央揃え */
            cursor: pointer;
            font-size: 14px;             /* 文字がはみ出さない適切なサイズ */
            font-weight: bold;
            text-align: center;
            line-height: 1.2;            /* 縦伸びを防止する行間設定 */
            padding: 2px;
            white-space: normal;         /* 2行になっても綺麗に収める */
            word-break: break-all;
        }

        /* 署所名セル */
        .cell-station {
            background-color: #e8e8e8;
            cursor: default;
            border-right: 2px solid var(--border-line);
            font-size: 15px;
        }

        /* 車両選択時 */
        .cell.active {
            background-color: var(--active-red);
            color: #ffffff;
            animation: blinkEffect 0.5s infinite alternate;
        }

        @keyframes blinkEffect {
            from { background-color: #ff3333; }
            to { background-color: #a00000; }
        }

        /* 下部：複合操作エリア */
        .lower-container {
            height: 55%;
            display: flex;
            gap: 8px;
        }

        /* 地図表示エリア */
        .map-area {
            width: 35%;
            background-color: #e0e0e0;
            border: 2px solid var(--border-line);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }
        
        .map-img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background-color: #ccc;
        }
        
        .map-controls {
            position: absolute;
            bottom: 5px;
            left: 5px;
            background: rgba(255,255,255,0.9);
            padding: 4px 8px;
            border: 1px solid #999;
            border-radius: 3px;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
        }

        /* 操作パネル */
        .controls-panel {
            flex-grow: 1;
            background-color: var(--bg-white);
            border: 2px solid var(--border-line);
            padding: 10px;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            grid-template-rows: repeat(3, auto) 1fr;
            gap: 10px;
        }

        .setting-item {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .label-text {
            font-size: 14px;
            font-weight: bold;
            color: #333;
        }

        select, input {
            padding: 10px;
            font-size: 16px;
            font-weight: bold;
            border: 2px solid var(--border-line);
            background: white;
            color: var(--text-black);
            width: 100%;
            box-sizing: border-box;
        }

        .setting-item.wide {
            grid-column: span 2;
        }

        .dispatch-btn-container {
            grid-column: span 2;
            display: flex;
            align-items: flex-end;
        }

        /* 超巨大 出動決定ボタン */
        .btn-dispatch {
            background-color: var(--bg-white);
            color: black;
            border: 4px solid #666;
            width: 100%;
            height: 80px;
            font-size: 32px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.15);
        }

        .btn-dispatch:active {
            background-color: #e0e0e0;
        }
    </style>
</head>
<body>

<div class="grid-container" id="grid"></div>

<div class="lower-container">
    <div class="map-area">
        <img id="map-display" src="https://cyberjapandata.gsi.go.jp/xyz/std/12/3638/1614.png" alt="地図" class="map-img">
        <label class="map-controls">
            地図画像を選択
            <input type="file" id="map-input" accept="image/*" style="display:none;" onchange="loadCustomMap(this)">
        </label>
    </div>

    <div class="controls-panel">
        <div class="setting-item">
            <span class="label-text">司令区分</span>
            <select id="cmdType">
                <option value="火災司令">火災司令</option>
                <option value="救急司令">救急司令</option>
                <option value="救助司令">救助司令</option>
                <option value="災害司令">災害司令</option>
                <option value="その他">その他</option>
            </select>
        </div>
        <div class="setting-item">
            <span class="label-text">町名・場所</span>
            <select id="townName">
                <option value="学園都市">学園都市</option>
                <option value="蔓崎">蔓崎</option>
                <option value="研究学園都市">研究学園都市</option>
                <option value="新都市中央通り">新都市中央通り</option>
                <option value="すくば駅通り">すくば駅通り</option>
            </select>
        </div>
        <div class="setting-item">
            <span class="label-text">丁目</span>
            <select id="blockNum">
                <option value="">（なし）</option>
                <option value="一丁目">一丁目</option>
                <option value="二丁目">二丁目</option>
                <option value="三丁目">三丁目</option>
                <option value="四丁目">四丁目</option>
                <option value="五丁目">五丁目</option>
            </select>
        </div>
        <div class="setting-item">
            <span class="label-text">付加情報</span>
            <select id="nearBy">
                <option value="">（なし）</option>
                <option value="付近">付近</option>
            </select>
        </div>
        <div class="setting-item wide">
            <span class="label-text">自由入力詳細</span>
            <input type="text" id="freeText" placeholder="内容を入力">
        </div>

        <div class="dispatch-btn-container">
            <button class="btn-dispatch" onclick="startDispatch()">出動決定</button>
        </div>
    </div>
</div>

<script>
    // 13車両データ
    const data = [
        {
            station: "中央署",
            units: ["高度救助隊11", "高度救助隊12", "第一救急隊 14", "第二救急隊 8", "中央タンク34", "中央ポンプ4", "中央指揮2"]
        },
        {
            station: "並木分署",
            units: ["並木指揮6", "並木ポンプ64", "並木高度救助隊 13", "並木タンク9", "並木第一救急隊 16", "並木第二救急隊 14"]
        }
    ];

    // 車両グリッド生成
    const grid = document.getElementById('grid');
    data.forEach(group => {
        const sCell = document.createElement('div');
        sCell.className = 'cell cell-station';
        sCell.innerText = group.station;
        grid.appendChild(sCell);
        
        group.units.forEach(u => {
            const cell = document.createElement('div');
            cell.className = 'cell';
            cell.innerText = u;
            cell.onclick = () => {
                if (window.speechSynthesis) window.speechSynthesis.cancel();
                cell.classList.toggle('active');
            };
            grid.appendChild(cell);
        });
        
        let fill = 5 - ((group.units.length + 1) % 5);
        if (fill < 5 && fill > 0) {
            for(let i=0; i<fill; i++) {
                const emptyCell = document.createElement('div');
                emptyCell.className = 'cell';
                emptyCell.style.backgroundColor = '#fafafa';
                emptyCell.style.border = '1px dashed #eee';
                grid.appendChild(emptyCell);
            }
        }
    });

    function loadCustomMap(input) {
        if (input.files && input.files[0]) {
            const reader = new FileReader();
            reader.onload = function(e) {
                document.getElementById('map-display').src = e.target.result;
            };
            reader.readAsDataURL(input.files[0]);
        }
    }

    function startDispatch() {
        const selectedElements = document.querySelectorAll('.cell.active');
        const selectedUnits = Array.from(selectedElements).map(el => el.innerText);
        
        if (selectedUnits.length === 0) return;

        const cmd = document.getElementById('cmdType').value;
        const town = document.getElementById('townName').value;
        const block = document.getElementById('blockNum').value;
        const near = document.getElementById('nearBy').value;
        const free = document.getElementById('freeText').value;

        const address = `すくば市、${town}、${block}${near}`;
        const speechText = `${cmd}。${address}。${free}。出動部隊、${selectedUnits.join("、")}。以上。`;

        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            const uttr = new SpeechSynthesisUtterance(speechText);
            uttr.lang = 'ja-JP';
            uttr.rate = 1.25;

            setTimeout(() => {
                window.speechSynthesis.speak(uttr);
            }, 100);
        }

        selectedElements.forEach(el => {
            el.classList.remove('active');
            el.style.backgroundColor = 'var(--dispatched-gray)';
            el.style.color = "#666666";
        });
    }
</script>
</body>
</html>
